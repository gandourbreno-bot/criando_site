
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista de Militares</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px #00000012;
    }

    h1 {
      margin-top: 0;
      color: #164e3b;
      text-align: center;
    }

    .subtitulo {
      text-align: center;
      color: #64748b;
      margin-bottom: 24px;
    }

    .barra {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 6px;
      background: #166534;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #14532d;
    }

    .tabela-container {
      overflow-x: auto;
    }

    #formCadastro {
  margin: 20px 0;
  padding: 20px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: #f8fafc;
}

#formCadastro[hidden] {
  display: none;
}

#formCadastro label {
  display: block;
  margin: 12px 0 6px;
  font-weight: bold;
}

#formCadastro input {
  width: 100%;
  margin-bottom: 8px;
}

#formCadastro h2 {
  margin-top: 0;
  font-size: 20px;
}
#formCadastro select {
  display: block;
  width: 100%;
  padding: 11px;
  margin-bottom: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 15px;
  background: white;
}    
    

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 13px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    th {
      background: #166534;
      color: white;
    }

    tbody tr:nth-child(even) {
      background: #f8fafc;
    }

    #mensagem {
      color: #475569;
      margin: 14px 0;
    }

    .contador {
      margin-top: 16px;
      color: #475569;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 16px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Lista de Militares</h1>

    <p class="subtitulo">
      Consulta de militares cadastrados
    </p>

   <div class="barra">
    <input
    type="search"
    id="pesquisa"
    placeholder="Pesquisar por nome ou posto..."
    aria-label="Pesquisar militares"
    >

    <button id="atualizar" type="button">Atualizar</button>

    <button id="abrirCadastro" type="button">
    + Incluir militar
    </button>
    </div>

    <p id="mensagem" role="status">Carregando dados...</p>

    <div class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Posto/Graduação</th>
            <th>Nome de Guerra</th>
          </tr>
        </thead>

        <tbody id="listaMilitares"></tbody>
      </table>
    </div>

    <p class="contador" id="contador"></p>
  </main>

<form id="formCadastro" hidden>
  <h2>Incluir militar</h2>

  <label for="novoNome">Nome de guerra</label>
  <input
    type="text"
    id="novoNome"
    maxlength="100"
    required
    placeholder="Digite o nome de guerra"
  >

  <label for="novoSaram">SARAM</label>
  <input
    type="text"
    id="novoSaram"
    required
    placeholder="Digite o SARAM"
  >

  <label for="novoPosto">Posto/Graduação</label>
  <select id="novoPosto" required>
    <option value="">Carregando opções...</option>
  </select>

  <div class="barra">
    <button type="submit" id="salvarMilitar">Salvar</button>
    <button type="button" id="cancelarCadastro">Cancelar</button>
  </div>
</form>

  
  <!-- Biblioteca oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Configure com os dados do seu projeto Supabase
    const SUPABASE_URL = "https://mqfkmrsanzuczgmuaqmd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ek7az2YB6N1D0XFNR8qI7A_9fNoI4Jm";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let militares = [];

    async function carregarMilitares() {
      const mensagem = document.getElementById("mensagem");
      const corpo = document.getElementById("listaMilitares");
      const contador = document.getElementById("contador");

      mensagem.textContent = "Carregando dados...";
      corpo.replaceChildren();
      contador.textContent = "";

      try {
        // Consulta a tabela e seleciona apenas as duas colunas
        const { data, error } = await supabaseClient
        .from("lista_de_militares")
        .select("nome_guerra, posto_grad")
        .order("posto_grad", { ascending: true })
        .order("nome_guerra", { ascending: true });

        if (error) throw error;

        militares = data || [];

        mensagem.textContent = militares.length
          ? "Dados carregados com sucesso."
          : "Nenhum militar encontrado.";

        exibirMilitares();

     } catch (erro) {
        console.error("Erro ao consultar militares:", erro);

        mensagem.textContent =
        "Erro ao carregar os dados: " +
          (erro.message || "Verifique o Console do navegador.");

        corpo.replaceChildren();
          contador.textContent = "";
}
    }

    async function carregarPostos() {
  const select = document.getElementById("novoPosto");

  select.replaceChildren(
    new Option("Carregando opções...", "")
  );
  select.disabled = true;

  try {
    const { data, error } = await supabaseClient
      .from("posto")
      .select("id, Posto_grad")
      .order("Posto_grad", { ascending: true });

    if (error) {
      console.error("Erro ao consultar tabela posto:", error);
      throw error;
    }

    console.log("Postos retornados pelo Supabase:", data);

    select.replaceChildren(
      new Option(
        data?.length
          ? "Selecione o posto/graduação"
          : "Nenhum posto cadastrado",
        ""
      )
    );

    (data || []).forEach(posto => {
      select.add(
        new Option(posto.Posto_grad, String(posto.id))
      );
    });

  } catch (erro) {
    select.replaceChildren(
      new Option("Erro ao carregar postos", "")
    );

    document.getElementById("mensagem").textContent =
      "Erro ao carregar postos: " + erro.message;

  } finally {
    select.disabled = false;
  }
}

    function exibirMilitares() {
      const corpo = document.getElementById("listaMilitares");
      const pesquisa = document
        .getElementById("pesquisa")
        .value.trim()
        .toLocaleLowerCase("pt-BR");

      corpo.replaceChildren();

      const filtrados = militares.filter(militar => {
        const nome = String(militar.nome_guerra || "")
          .toLocaleLowerCase("pt-BR");

        const posto = String(militar.posto_grad || "")
          .toLocaleLowerCase("pt-BR");

        return nome.includes(pesquisa) || posto.includes(pesquisa);
      });

      filtrados.forEach(militar => {
        const linha = document.createElement("tr");

        [militar.posto_grad, militar.nome_guerra].forEach(valor => {
          const celula = document.createElement("td");
          celula.textContent = valor ?? "";
          linha.appendChild(celula);
        });

        corpo.appendChild(linha);
      });

      document.getElementById("contador").textContent =
        `Exibindo ${filtrados.length} de ${militares.length} militar(es).`;
    }

    document.getElementById("pesquisa")
      .addEventListener("input", exibirMilitares);

    document.getElementById("atualizar")
      .addEventListener("click", carregarMilitares);

    carregarMilitares();

  const formCadastro = document.getElementById("formCadastro");

document.getElementById("abrirCadastro")
  .addEventListener("click", () => {
    formCadastro.hidden = false;
    document.getElementById("novoPosto").focus();
  });

document.getElementById("cancelarCadastro")
  .addEventListener("click", () => {
    formCadastro.reset();
    formCadastro.hidden = true;
  });

formCadastro.addEventListener("submit", async (evento) => {
  evento.preventDefault();

  const botao = document.getElementById("salvarMilitar");
  const mensagem = document.getElementById("mensagem");

  const nome = document.getElementById("novoNome").value.trim();
  const saram = document.getElementById("novoSaram").value.trim();
  const postoId = document.getElementById("novoPosto").value;

  if (!nome || !saram || !postoId) {
    mensagem.textContent = "Preencha todos os campos.";
    return;
  }

  botao.disabled = true;
  botao.textContent = "Salvando...";

  try {
    const { error } = await supabaseClient
      .from("militar")
      .insert({
        nome_guerra: nome,
        saram: saram,
        posto_grad: Number(postoId)
      });

    if (error) throw error;

    mensagem.textContent = "Militar cadastrado com sucesso!";

    formCadastro.reset();
    formCadastro.hidden = true;

    await carregarMilitares();

  } catch (erro) {
    console.error("Erro ao cadastrar militar:", erro);

    mensagem.textContent =
      "Erro ao cadastrar: " + erro.message;

  } finally {
    botao.disabled = false;
    botao.textContent = "Salvar";
  }
});
    
  </script>
</body>
</html>
